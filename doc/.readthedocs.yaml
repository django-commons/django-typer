# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  # shared libraries needed by playwright's chromium (used for png conversion in the
  # pdf build) - this is the list playwright itself installs for ubuntu 26.04 with
  # `playwright install --with-deps chromium`, which needs root and so can't be used here.
  apt_packages:
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  jobs:
    post_install:
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --all-extras --group docs --link-mode=copy

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: doc/source/conf.py
   
# Optionally build your docs in additional formats such as PDF and ePub
# remove pdf for now - sphinx tabs does not support
formats:
  - pdf
